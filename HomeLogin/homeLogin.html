<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Style/global.css">
    <link rel="stylesheet" href="homeLogin.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <title>MusicHub - Home</title>
</head>
<body>
    <header class="cabecalho">
        <div class="logo">
            <img src="../ImgHomeLogin/icone-song.svg" alt="" class="logo">
            <h1>MusicHub</h1>
        </div>
        <div class="navegacao-header">
            <input type="text" placeholder="  vamos pesquisar">
        </div>
        <div class="perfil">
            <a href="" class="sobre-nos">Sobre-nos</a>
            <i class="fa-solid fa-circle-user" style="color: rgb(98, 41, 212);"></i>
        </div>
    </header>
     <div class="divisao">
        <aside class="menu-lateral">
            <section class="navegacao">
                <div class="inicio">
                    <i class="fa-solid fa-house"></i>
                    <a href="#">Inicio</a>
                </div>
                <div class="explorar">
                    <i class="fa-regular fa-compass"></i>
                    <a href="#">Explorar</a>
                </div>
                <div class="biblioteca">
                    <i class="fa-solid fa-book"></i>
                    <a href="#">Biblioteca</a>
                </div>
            </section>
            <section class="minha-playlist">
                <div class="add-playlist">
                    <h3>Playslist</h3>
            <i class="fa-solid fa-plus"></i>        
                </div>
                <div class="playlists">
                    <div class="playlist">
                        <div class="icone">
                            <i class="fa-solid fa-heart"></i>
                        </div>
                        <a href="#">Minhas musicas</a>
                    </div>
                    <div class="playlist">
                        <div class="icone">
                            <i class="fa-solid fa-dumbbell"></i>
                        </div>
                        <a href="#">Academia</a>
                    </div>
                    <div class="playlist">
                        <div class="icone">
                            <i class="fa-solid fa-flag"></i>
                        </div>
                        <a href="#">Nacionais</a>
                    </div>
                    <div class="playlist">
                        <div class="icone">
                            <i class="fa-solid fa-pen-ruler"></i>
                        </div>
                        <a href="#">Estudar</a>
                    </div>
                </div>
            </section>
            <section class="ouvindo">
                <div class="titulo-msc">
                    <h2>Thriller</h2>
                    <p>Michael Jackson</p>
                </div>
                <div class="contagem">
                    <p>0:05</p>
                    <span></span>
                    <p>-5:50</p>
                </div>
                <div class="opcoes-msc">
                    <i class="fa-solid fa-shuffle"></i> 
                    <div class="controlador-msc">
                        <i class="fa-solid fa-backward-step"></i>
                        <i class="fa-solid fa-play"></i>
                        <i class="fa-solid fa-forward-step"></i>
                    </div>
                    <i class="fa-solid fa-heart"></i>
                </div>

            </section>
        </aside>
        </div>
