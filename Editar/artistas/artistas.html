<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicHub - Editar Artistas</title>

    <!-- icone olho senha -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="artistas.css">
</head>

<body>

    <!-- cabecalho e barra de nav -->
    <header class="cabecalho">
        <a href="#" class="logo-marca">
            <img src="../../imgVisaoAdm/Group (1).svg" alt="MusicHub Logo"
                class="imagem-logo-cabecalho">
            <span class="texto-marca">MusicHub</span>
        </a>
    </header>

    <!-- retangulo principal -->
    <main class="area-principal">
        <div class="cartao-cadastro">

            <!-- logo Central -->
            <div class="caixinha-logo-centro">
                <img src="../../imgVisaoAdm/Group (1).svg" alt="MusicHub Logo"
                    class="imagem-logo-principal">
            </div>

            <h1 class="titulo-cartao">Edite aqui o seu artista</h1>
            <p class="subtitulo-cartao">João Silva</p>

            <!-- principal -->
            <form class="formulario-cadastro">
                <div class="formulario">

                    <!-- nome do artista -->
                    <div class="input-texto">
                        <label class="rotulo-campo" for="nome-artista">Alterar nome</label>
                        <input type="text" id="nome-artista" class="caixa-texto" placeholder="Ex. João silva">
                    </div>

                    <!-- e-mail -->
                    <div class="input-texto">
                        <label class="rotulo-campo" for="email-artista">Alterar E-mail</label>
                        <input type="email" id="email-artista" class="caixa-texto" placeholder="Ex.: JoaoSilva@gmail.com">
                    </div>

                    <!-- Codigo do artista -->
                    <div class="input-texto">
                        <label class="rotulo-campo" for="codigo-artista">Editar músicas publicadas</label>
                        <input type="text" id="codigo-artista" class="caixa-texto" placeholder="Ex. evidencias">
                    </div>

                    <!-- Senha -->
                    <div class="input-texto">
                        <label class="rotulo-campo" for="senha-artista">Alterar senha do artista</label>
                        <div class="caixinha-senha">
                            <input type="password" id="senha-artista" class="caixa-texto">
                            <button type="button" class="botao-ocultar-senha" id="botaoOcultarSenha"
                                aria-label="Mostrar/Esconder senha">
                                <i class="fa-regular fa-eye-slash" id="iconeSenha"></i>
                            </button>
                        </div>
                        <span class="texto-ajuda">A senha será enviada ao artista</span>
                    </div>

                    <!-- Informacao adicional (ocupando 2 colunas do grid) -->
                    <div class="input-texto largura-total">
                        <label class="rotulo-campo" for="informacao-adicional">Informação adicional sobre o artista</label>
                        <input type="text" id="informacao-adicional" class="caixa-texto"
                            placeholder="Ex. Gosto musical, idade...">
                    </div>

                </div>

                <!-- Termos e Condicoes -->
                <div class="caixinha-termos">
                    <input type="checkbox" id="caixa-termos" class="caixa-selecao" required>
                    <label for="caixa-termos" class="rotulo-termos">
                        Eu li e concordo com os <span class="destaque-termos">Termos de uso</span> e <span
                            class="destaque-termos">Política de privacidade</span> do MusicHub
                    </label>
                </div>

                <button type="submit" class="botao-cadastrar">
                    Confirmar alterações
                </button>
            </form>

        </div>
    </main>

</body>

</html>
