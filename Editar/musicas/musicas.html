<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicHub - Editar Músicas</title>

  

    <link rel="stylesheet" href="musicas.css">
</head>

<body>

    <!-- cabecalho e barra de nav -->
    <header class="cabecalho">
        <a href="#" class="logo-marca">
            <img src="../../imgVisaoAdm/Group (1).svg" alt="MusicHub Logo"
                class="imagem-logo-cabecalho">
            <span class="texto-marca">MusicHub</span>
        </a>
    </header>

    <!-- retangulo principal -->
    <main class="area-principal">
        <div class="cartao-cadastro">

            <!-- logo Central -->
            <div class="caixinha-logo-centro">
                <img src="../../imgVisaoAdm/Group (1).svg" alt="MusicHub Logo"
                    class="imagem-logo-principal">
            </div>

            <h1 class="titulo-cartao">Edite aqui a sua musica</h1>
            <p class="subtitulo-cartao">Evidências</p>

            <!-- principal -->
            <form class="formulario-cadastro">
                <div class="formulario">

                    <!-- nome -->
                    <div class="input-texto">
                        <label class="rotulo-campo" for="nome-artista">Alterar nome</label>
                        <input type="text" id="nome-artista" class="caixa-texto" placeholder="Ex. João silva">
                    </div>

                    <!-- letra-->
                    <div class="input-texto">
                        <label class="rotulo-campo" for="email-artista">Alterar Letra</label>
                        <input type="email" id="email-artista" class="caixa-texto" placeholder="Ex.:Lorem ipsum dolor sit amet">
                    </div>

                    <!-- Codigo do artista -->
                    <div class="input-texto">
                        <label class="rotulo-campo" for="codigo-artista">Editar artista associado</label>
                        <input type="text" id="codigo-artista" class="caixa-texto" placeholder="Ex. Racionais">
                    </div>

                    <!-- Senha -->
                    <div class="input-texto">
                        <label class="rotulo-campo" for="senha-artista">Adicionar outro artista associado</label>
                        <div class="caixinha-senha">
                            <input type="password" id="senha-artista" class="caixa-texto">
                            <button type="button" class="botao-ocultar-senha" id="botaoOcultarSenha"
                                aria-label="Mostrar/Esconder senha">
                                <i class="fa-regular fa-eye-slash" id="iconeSenha"></i>
                            </button>
                        </div>
                
                    </div>


                    <div class="input-texto largura-total">
                        <label class="rotulo-campo" for="informacao-adicional">Informação adicional sobre a música </label>
                        <input type="text" id="informacao-adicional" class="caixa-texto"
                            placeholder="Ex. Data de publicação...">
                    </div>

                </div>

                <!-- Termos e Condicoes -->
                <div class="caixinha-termos">
                    <input type="checkbox" id="caixa-termos" class="caixa-selecao" required>
                    <label for="caixa-termos" class="rotulo-termos">
                        Eu li e concordo com os <span class="destaque-termos">Termos de uso</span> e <span
                            class="destaque-termos">Política de privacidade</span> do MusicHub
                    </label>
                </div>

                <button type="submit" class="botao-cadastrar">
                    Confirmar alterações
                </button>
            </form>

        </div>
    </main>

</body>

</html>
