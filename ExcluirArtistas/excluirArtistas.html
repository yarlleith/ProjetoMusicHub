<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicHub - Inativar Artistas</title>

    <link rel="stylesheet" href="excluirartistas.css">
</head>

<body>

    <!-- cabecalho e barra de nav -->
    <header class="cabecalho">
        <a href="#" class="logo-marca">
            <img src="../imgExcluirArtistas/Logo MusicHub 2 (1).svg" alt="MusicHub Logo" class="imagem-logo-cabecalho">
            <span class="texto-marca">MusicHub</span>
        </a>
    </header>

    <!-- retangulo principal -->
    <main class="area-principal">
        <div class="cartao-cadastro">

            <!-- logo Central -->
            <div class="caixinha-logo-centro">
                <img src="../imgExcluirArtistas/Logo MusicHub 2 (1).svg" alt="MusicHub Logo" class="imagem-logo-principal">
            </div>

            <h1 class="titulo-cartao">Realmente deseja inativar este artista?</h1>
            <p class="subtitulo-cartao">Essa ação não poderá ser desfeita futuramente</p>

            <!-- principal -->
            <div class="formulario">


                <div class="input-texto largura-total">
                    <label class="rotulo-campo" for="informacao-adicional">Justifique aqui o motivo da inativação do
                        artista</label>
                    <input type="text" id="informacao-adicional" class="caixa-texto"
                        placeholder="Ex. Não cumpriu as diretrizes...">
                </div>

            </div>


            <div class="texto-informativo">
                <p>

                    Ao selecionar a opção de exclusão, você apagará permanentemente o artista selecionado do sistema.
                    Essa ação é irreversível e não poderá ser desfeita futuramente.
                    O artista será notificado dessa ação.


                </p>
            </div>


            <div class="caixinha-termos">
                <input type="checkbox" id="caixa-termos" class="caixa-selecao" required>
                <label for="caixa-termos" class="rotulo-termos">
                    Eu li e concordo com os <span class="destaque-termos">Termos de uso</span> e <span
                        class="destaque-termos">Política de privacidade</span> do MusicHub
                </label>
            </div>

            <button type="submit" class="botao-cadastrar">
                Excluir
            </button>

        </div>
    </main>

</body>

</html>
